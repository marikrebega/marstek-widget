name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute dynamic app version
        id: version
        shell: bash
        run: |
          RUN_NUM="${{ github.run_number }}"
          SHORT_SHA="${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [[ -n "$LATEST_TAG" ]]; then
              BASE_VER="${LATEST_TAG#v}"
              COMMITS_SINCE=$(git rev-list "${LATEST_TAG}..HEAD" --count 2>/dev/null || echo "0")
              VERSION_NAME="${BASE_VER}.${COMMITS_SINCE}-b${RUN_NUM}-${SHORT_SHA}"
            else
              COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "1")
              VERSION_NAME="1.0.${COMMIT_COUNT}-b${RUN_NUM}-${SHORT_SHA}"
            fi
          fi

          echo "version_code=${RUN_NUM}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved versionCode=${RUN_NUM}, versionName=${VERSION_NAME}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build web UI assets for Android
        run: |
          npm ci
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon \
            -PversionCode="${{ steps.version.outputs.version_code }}" \
            -PversionName="${{ steps.version.outputs.version_name }}"

      - name: Rename APK with version
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             "app/build/outputs/apk/debug/marstek-venus-widget-${{ steps.version.outputs.version_name }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: marstek-venus-widget-${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/debug/marstek-venus-widget-${{ steps.version.outputs.version_name }}.apk

      - name: Publish Release APK on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/marstek-venus-widget-${{ steps.version.outputs.version_name }}.apk
