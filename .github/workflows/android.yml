name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute dynamic app version
        id: version
        shell: bash
        run: |
          RUN_NUM="${{ github.run_number }}"
          SHORT_SHA="${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [[ -n "$LATEST_TAG" ]]; then
              BASE_VER="${LATEST_TAG#v}"
              COMMITS_SINCE=$(git rev-list "${LATEST_TAG}..HEAD" --count 2>/dev/null || echo "0")
              VERSION_NAME="${BASE_VER}.${COMMITS_SINCE}-b${RUN_NUM}-${SHORT_SHA}"
            else
              COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "1")
              VERSION_NAME="1.0.${COMMIT_COUNT}-b${RUN_NUM}-${SHORT_SHA}"
            fi
          fi

          echo "version_code=${RUN_NUM}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved versionCode=${RUN_NUM}, versionName=${VERSION_NAME}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build web UI assets for Android
        run: |
          npm ci
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Release Keystore
        shell: bash
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/app/release.keystore"
          if [[ -n "$SECRET_KEYSTORE_B64" && -n "$SECRET_STORE_PASS" && -n "$SECRET_KEY_ALIAS" && -n "$SECRET_KEY_PASS" ]]; then
            echo "$SECRET_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$SECRET_STORE_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
            echo "Using persistent KEYSTORE_BASE64 secret for release signing."
          else
            TEMP_PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias marstek_release \
              -storepass "$TEMP_PASS" -keypass "$TEMP_PASS" \
              -dname "CN=Marstek Venus Widget, OU=Mobile, O=Marstek, L=Ivano-Frankivsk, C=UA"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$TEMP_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=marstek_release" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$TEMP_PASS" >> "$GITHUB_ENV"
            echo "WARNING: KEYSTORE_BASE64 secret not set; generated ephemeral release keystore."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Build Signed Release APK
        run: |
          gradle assembleRelease --no-daemon \
            -PversionCode="${{ steps.version.outputs.version_code }}" \
            -PversionName="${{ steps.version.outputs.version_name }}"

      - name: Rename APK with version
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/marstek-venus-widget-${{ steps.version.outputs.version_name }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: marstek-venus-widget-${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/marstek-venus-widget-${{ steps.version.outputs.version_name }}.apk

      - name: Publish Release APK on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/marstek-venus-widget-${{ steps.version.outputs.version_name }}.apk
